<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="1160" viewBox="0 0 2000 1160">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2233"/></marker></defs>
<rect width="2000" height="1160" fill="white"/>
<circle cx="57" cy="54" r="17" fill="#1b2233"/><text x="57" y="60" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">A</text><text x="84" y="60" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="start">Where VoxTool runs × where the CT lives</text>
<text x="725.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="middle">Desktop app  ·  macOS, Windows  (Linux: run from source)</text>
<text x="1545.0" y="130" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="middle">Web app  ·  any browser, nothing to install</text>
<text x="300" y="231.5" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="end">CT on your</text>
<text x="300" y="255.5" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="end">computer</text>
<text x="300" y="436.5" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="end">CT in the</text>
<text x="300" y="460.5" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="end">cloud</text>
<rect x="330" y="150" width="790" height="175" rx="14" fill="white" stroke="#16a34a" stroke-width="2.5"/>
<rect x="350" y="170" width="96.8" height="30" rx="15" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="398.4" y="191" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">Available</text>
<text x="350" y="235" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="start">Open a CT in place, from any folder.</text>
<text x="350" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">Nothing leaves the machine. Implant plans are read</text>
<text x="350" y="289" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">by a model running locally.</text>
<rect x="1150" y="150" width="790" height="175" rx="14" fill="white" stroke="#d97706" stroke-width="2.5"/>
<rect x="1170" y="170" width="336.0" height="30" rx="15" fill="#d97706" stroke="#d97706" stroke-width="2"/><text x="1338.0" y="191" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">Available · de-identified data only</text>
<text x="1170" y="235" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="start">Upload a CT from the browser.</text>
<text x="1170" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">It is stored on the server (AWS), and the web app has</text>
<text x="1170" y="289" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">no login yet, so use public or de-identified scans.</text>
<rect x="330" y="355" width="790" height="175" rx="14" fill="white" stroke="#16a34a" stroke-width="2.5"/>
<rect x="350" y="375" width="207.2" height="30" rx="15" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="453.6" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">Available · Pennsieve</text>
<text x="350" y="440" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="start">Open a CT from a Pennsieve dataset; upload</text>
<text x="350" y="467" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">coordinates back to it. Uses the Pennsieve agent</text>
<text x="350" y="494" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">on this machine. OpenNeuro: planned.</text>
<rect x="1150" y="355" width="790" height="175" rx="14" fill="white" stroke="#9aa3b2" stroke-width="2.5" stroke-dasharray="10 7"/>
<rect x="1170" y="375" width="78.39999999999999" height="30" rx="15" fill="white" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 4"/><text x="1209.2" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#9aa3b2" text-anchor="middle">Planned</text>
<text x="1170" y="440" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="start">Not yet.</text>
<text x="1170" y="467" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">Pennsieve needs the agent on your own machine,</text>
<text x="1170" y="494" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">so the web app cannot reach it.</text>
<circle cx="57" cy="644" r="17" fill="#1b2233"/><text x="57" y="650" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">B</text><text x="84" y="650" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="start">Opening and saving through the Pennsieve API (desktop app)</text>
<rect x="40" y="690" width="330" height="150" rx="14" fill="#f3f5f8" stroke="#c8ced8" stroke-width="2.5"/><text x="205.0" y="732" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="middle">VoxTool</text><text x="205.0" y="762" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="middle">local server on</text><text x="205.0" y="786" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="middle">your computer</text>
<rect x="520" y="690" width="330" height="150" rx="14" fill="#f3f5f8" stroke="#c8ced8" stroke-width="2.5"/><text x="685.0" y="732" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="middle">Pennsieve agent</text><text x="685.0" y="762" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="middle">also on your computer;</text><text x="685.0" y="786" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="middle">holds the sign-in</text>
<rect x="1000" y="690" width="380" height="150" rx="14" fill="white" stroke="#c8ced8" stroke-width="2.5"/>
<image href="../fig1/assets/logos/pennsieve-logo-full.png" xlink:href="../fig1/assets/logos/pennsieve-logo-full.png" x="1040" y="720" width="300" height="60" preserveAspectRatio="xMidYMid meet"/>
<text x="1190" y="812" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="middle">Pennsieve API (cloud)</text>
<rect x="1530" y="690" width="430" height="150" rx="14" fill="white" stroke="#c8ced8" stroke-width="2.5"/><text x="1745.0" y="732" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="middle">Your dataset</text><text x="1745.0" y="762" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="middle">primary/sub-XX/ses-postimplant/ct</text><text x="1745.0" y="786" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="middle">derivatives/voxtool_ct (coordinates)</text>
<line x1="378" y1="745" x2="512" y2="745" stroke="#1b2233" stroke-width="3.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="445" y="730" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="middle">session token</text>
<line x1="858" y1="745" x2="992" y2="745" stroke="#1b2233" stroke-width="3.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="925" y="730" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="middle">upload</text>
<line x1="1388" y1="745" x2="1522" y2="745" stroke="#1b2233" stroke-width="3.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M 205 848 C 205 940, 1190 940, 1190 848" stroke="#0ea5e9" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/>
<text x="700" y="950" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#0ea5e9" text-anchor="middle">browse datasets and download a CT (REST API, with the agent's token)</text>
<text x="40" y="1000" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">The API key lives in the Pennsieve agent's own config; VoxTool never keeps it.</text>
<text x="40" y="1028" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">Uploads go only to datasets this computer is allowed to write to (a per-computer setting).</text>
<rect x="1300" y="960" width="660" height="110" rx="14" fill="white" stroke="#9aa3b2" stroke-width="2.5" stroke-dasharray="10 7"/>
<image href="../fig1/assets/logos/openneuro-brand-mark.png" xlink:href="../fig1/assets/logos/openneuro-brand-mark.png" x="1325" y="978" width="72" height="72" preserveAspectRatio="xMidYMid meet"/>
<text x="1415" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#1b2233" text-anchor="start">OpenNeuro API</text>
<text x="1415" y="1032" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#5b6475" text-anchor="start">planned: open public datasets by ID</text>
</svg>