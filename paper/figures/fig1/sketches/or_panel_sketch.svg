<text x="476" y="422" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5b6475" text-anchor="start">suggests the operating room</text>
<text x="450" y="480" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b2233" text-anchor="start">Style</text>
<text x="450" y="504" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1b2233" text-anchor="start">• clean, flat, no blood</text>
<text x="450" y="526" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1b2233" text-anchor="start">• contacts in warm orange-red (#e4572e),</text>
<text x="450" y="548" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1b2233" text-anchor="start">  same as electrodes elsewhere in the figure</text>
<text x="450" y="570" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1b2233" text-anchor="start">• view from above, slightly tilted is fine</text>
<text x="450" y="610" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1b2233" text-anchor="start">Avoid</text>
<text x="450" y="634" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1b2233" text-anchor="start">• faces or real patient photos</text>
<text x="450" y="656" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1b2233" text-anchor="start">• text inside the art (labels go in the layout)</text>
<text x="450" y="700" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1b2233" text-anchor="start">Panel size: 1 wide × 1.8 tall (e.g. 1000 × 1800 px)</text>
